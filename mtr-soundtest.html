<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR. TRUCK'S REVENGE - Soundtrack</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        #sound-test-container {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            padding: 20px;
        }

        .sound-box {
            background: linear-gradient(145deg, rgba(12, 18, 32, .96), rgba(8, 12, 24, .98));
            border: 3px solid transparent;
            border-image: linear-gradient(135deg, rgba(0, 0, 0, 0.8), rgba(30, 30, 60, 0.4), rgba(0, 0, 0, 0.8)) 1;
            border-radius: 20px;
            padding: 40px;
            max-width: 800px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 0 60px rgba(42, 82, 152, .25), inset 0 0 40px rgba(0, 10, 25, .7);
            position: relative;
        }

        .sound-title {
            font-size: 48px;
            font-weight: 900;
            color: var(--accent);
            text-shadow: 0 0 10px rgba(0, 255, 213, .3), 0 0 30px rgba(0, 255, 213, .2);
            margin-bottom: 32px;
            text-align: center;
            letter-spacing: -1px;
        }

        .sound-category {
            margin-bottom: 32px;
        }

        .category-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 215, 0, .3);
            text-shadow: 0 0 10px rgba(255, 215, 0, .2);
        }

        .sound-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .sound-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            background: linear-gradient(135deg, rgba(0, 255, 213, .1), rgba(0, 255, 213, .05));
            border: 2px solid var(--accent);
            border-radius: 12px;
            color: var(--text);
            font-weight: 700;
            font-size: 11px;
            cursor: pointer;
            transition: all .2s cubic-bezier(.4, 0, .2, 1);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: .5px;
            min-height: 80px;
        }

        .sound-btn:hover {
            background: linear-gradient(135deg, rgba(0, 255, 213, .2), rgba(0, 255, 213, .1));
            box-shadow: 0 0 20px rgba(0, 255, 213, .4);
            transform: translateY(-2px);
        }

        .sound-btn:active {
            transform: translateY(0);
            box-shadow: 0 0 10px rgba(0, 255, 213, .2);
        }

        .sound-icon {
            font-size: 22px;
        }

        .sound-label {
            font-size: 10px;
            line-height: 1.2;
        }

        .controls-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            background: linear-gradient(to bottom, rgba(12, 18, 32, .98), transparent);
            padding: 16px 0;
            z-index: 10;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .volume-slider {
            width: 150px;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(0, 255, 213, .2);
            outline: none;
            border-radius: 3px;
            accent-color: var(--accent);
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            background: var(--accent);
            cursor: pointer;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0, 255, 213, .6);
        }

        .volume-slider::-moz-range-thumb {
            width: 14px;
            height: 14px;
            background: var(--accent);
            cursor: pointer;
            border-radius: 50%;
            border: none;
            box-shadow: 0 0 10px rgba(0, 255, 213, .6);
        }

        .volume-label {
            font-size: 12px;
            color: var(--accent);
            text-shadow: 0 0 6px var(--crt-glow);
            white-space: nowrap;
        }

        .volume-value {
            font-weight: 700;
            color: var(--gold);
            min-width: 28px;
            font-size: 12px;
        }

        .control-btn {
            background: linear-gradient(135deg, var(--accent), #0ca);
            color: #000;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: all .2s cubic-bezier(.4, 0, .2, 1);
            text-transform: uppercase;
            letter-spacing: .5px;
        }

        .control-btn:hover {
            box-shadow: 0 4px 20px rgba(0, 255, 213, .4);
            transform: translateY(-1px);
        }

        .control-btn:active {
            transform: translateY(0);
        }

        .back-btn {
            background: rgba(255, 61, 87, .2);
            color: var(--danger);
            border: 2px solid var(--danger);
        }

        .back-btn:hover {
            background: var(--danger);
            color: #fff;
            box-shadow: 0 4px 20px rgba(255, 61, 87, .4);
        }

        .now-playing {
            text-align: center;
            color: var(--gold);
            font-size: 12px;
            font-weight: 700;
            padding: 12px;
            background: rgba(255, 215, 0, .05);
            border: 1px solid rgba(255, 215, 0, .2);
            border-radius: 8px;
            min-height: 20px;
            text-shadow: 0 0 6px rgba(255, 215, 0, .3);
        }

        @media (max-width: 600px) {
            .sound-box {
                padding: 20px;
            }

            .sound-title {
                font-size: 32px;
                margin-bottom: 20px;
            }

            .sound-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .volume-slider {
                width: 100px;
            }
        }
    </style>
</head>
<body>
    <div id="sound-test-container">
        <div class="sound-box">
            <div class="controls-bar">
                <div class="volume-control">
                    <span class="volume-label">MASTER:</span>
                    <input type="range" min="0" max="100" value="70" class="volume-slider" id="volumeSlider">
                    <span class="volume-value" id="volumeValue">70%</span>
                </div>
                <button class="control-btn" id="stopBtn">⏹ STOP</button>
                <button class="control-btn back-btn" onclick="window.history.back()">← BACK</button>
            </div>

            <div class="sound-title">🎵 SOUNDTRACK 🎵</div>
            
            <!-- LOOPING MUSIC -->
            <div class="sound-category">
                <div class="category-title">🔄 Background Loops</div>
                <div class="sound-grid">
                    <button class="sound-btn" data-type="loop" data-sound="menu">
                        <span class="sound-icon">🍔</span>
                        <span class="sound-label">MENU LOOP</span>
                    </button>
                    <button class="sound-btn" data-type="loop" data-sound="chase">
                        <span class="sound-icon">🏎️</span>
                        <span class="sound-label">CHASE LOOP</span>
                    </button>
                    <button class="sound-btn" data-type="loop" data-sound="intro">
                        <span class="sound-icon">🤖</span>
                        <span class="sound-label">INTRO LOOP</span>
                    </button>
                </div>
            </div>

            <!-- MOTIFS & SNIPPETS -->
            <div class="sound-category">
                <div class="category-title">✨ Motifs & Snippets</div>
                <div class="sound-grid">
                    <button class="sound-btn" data-type="motif" data-sound="title">
                        <span class="sound-icon">🎬</span>
                        <span class="sound-label">TITLE</span>
                    </button>
                    <button class="sound-btn" data-type="motif" data-sound="menuStart">
                        <span class="sound-icon">▶️</span>
                        <span class="sound-label">MENU START</span>
                    </button>
                    <button class="sound-btn" data-type="motif" data-sound="chaseStart">
                        <span class="sound-icon">🚨</span>
                        <span class="sound-label">CHASE START</span>
                    </button>
                    <button class="sound-btn" data-type="motif" data-sound="countdown">
                        <span class="sound-icon">⏱️</span>
                        <span class="sound-label">COUNTDOWN</span>
                    </button>
                    <button class="sound-btn" data-type="motif" data-sound="nitro">
                        <span class="sound-icon">💨</span>
                        <span class="sound-label">NITRO</span>
                    </button>
                    <button class="sound-btn" data-type="motif" data-sound="crash">
                        <span class="sound-icon">💥</span>
                        <span class="sound-label">CRASH</span>
                    </button>
                    <button class="sound-btn" data-type="motif" data-sound="nearMiss">
                        <span class="sound-icon">😅</span>
                        <span class="sound-label">NEAR MISS</span>
                    </button>
                    <button class="sound-btn" data-type="motif" data-sound="truck">
                        <span class="sound-icon">🔨</span>
                        <span class="sound-label">TRUCK</span>
                    </button>
                    <button class="sound-btn" data-type="motif" data-sound="wrecked">
                        <span class="sound-icon">💀</span>
                        <span class="sound-label">WRECKED</span>
                    </button>
                    <button class="sound-btn" data-type="motif" data-sound="achievement">
                        <span class="sound-icon">🏆</span>
                        <span class="sound-label">ACHIEVEMENT</span>
                    </button>
                    <button class="sound-btn" data-type="motif" data-sound="upgrade">
                        <span class="sound-icon">⚡</span>
                        <span class="sound-label">UPGRADE</span>
                    </button>
                    <button class="sound-btn" data-type="motif" data-sound="shop">
                        <span class="sound-icon">🛒</span>
                        <span class="sound-label">SHOP</span>
                    </button>
                </div>
            </div>

            <div class="now-playing" id="nowPlaying">— SELECT A TRACK —</div>
        </div>
    </div>

    <script>
        /* ============ AUDIO SYNTHESIS ENGINE (from testnav_helpers2.html) ============ */
        
        let ctx = null;
        let master = null;
        let musicBus = null;
        let menuBus = null;
        let chaseBus = null;
        let motifBus = null;
        let sfxBus = null;
        let noiseBuffer = null;
        let delay = null;
        let loopTimer = null;
        let loopStep = 0;

        const BPM = 104;
        const STEP = 60 / BPM / 4;

        function midiHz(m) {
            return 440 * Math.pow(2, (m - 69) / 12);
        }

        function ensureAudio() {
            if (ctx) return;
            try {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return;

                ctx = new AC();
                master = ctx.createGain();
                master.gain.value = 0.22;
                const comp = ctx.createDynamicsCompressor();
                comp.threshold.value = -18;
                comp.knee.value = 24;
                comp.ratio.value = 6;
                master.connect(comp);
                comp.connect(ctx.destination);

                musicBus = ctx.createGain();
                musicBus.gain.value = 0.9;
                musicBus.connect(master);

                menuBus = ctx.createGain();
                menuBus.gain.value = 0.78;
                menuBus.connect(musicBus);

                chaseBus = ctx.createGain();
                chaseBus.gain.value = 0.88;
                chaseBus.connect(musicBus);

                motifBus = ctx.createGain();
                motifBus.gain.value = 0.95;
                motifBus.connect(master);

                sfxBus = ctx.createGain();
                sfxBus.gain.value = 0.85;
                sfxBus.connect(master);

                delay = ctx.createDelay(1.0);
                delay.delayTime.value = STEP * 3;
                const fb = ctx.createGain();
                fb.gain.value = 0.2;
                const damp = ctx.createBiquadFilter();
                damp.type = "lowpass";
                damp.frequency.value = 2400;
                delay.connect(damp);
                damp.connect(fb);
                fb.connect(delay);
                delay.connect(master);

                const len = Math.floor(ctx.sampleRate * 1.0);
                const buf = ctx.createBuffer(1, len, ctx.sampleRate);
                const data = buf.getChannelData(0);
                for (let i = 0; i < len; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 2);
                }
                noiseBuffer = buf;

                if (ctx.state === "suspended") {
                    ctx.resume().catch(() => {});
                }
            } catch (e) {
                ctx = null;
            }
        }

        function voice(bus, type, midi, t, dur, gain, opts = {}) {
            if (!ctx || !bus) return;
            const o = ctx.createOscillator();
            o.type = type;
            o.frequency.value = midiHz(midi);
            if (opts.detune) o.detune.value = opts.detune;
            const g = ctx.createGain();
            const attack = opts.attack == null ? 0.006 : opts.attack;
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(Math.max(0.001, gain), t + attack);
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            let out = o;
            if (opts.filter) {
                const f = ctx.createBiquadFilter();
                f.type = opts.filterType || "lowpass";
                f.frequency.value = opts.filter;
                f.Q.value = opts.q == null ? 1 : opts.q;
                o.connect(f);
                f.connect(g);
            } else {
                o.connect(g);
            }
            g.connect(bus);
            if (opts.delay && delay) g.connect(delay);
            o.start(t);
            o.stop(t + dur + (opts.release == null ? 0.08 : opts.release));
        }

        function noiseHit(bus, t, dur, gain, filterType = "bandpass", freq = 1000, q = 1) {
            if (!ctx || !bus || !noiseBuffer) return;
            const src = ctx.createBufferSource();
            src.buffer = noiseBuffer;
            const f = ctx.createBiquadFilter();
            f.type = filterType;
            f.frequency.value = freq;
            f.Q.value = q;
            const g = ctx.createGain();
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(Math.max(0.001, gain), t + 0.004);
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            src.connect(f);
            f.connect(g);
            g.connect(bus);
            src.start(t);
            src.stop(t + dur + 0.05);
        }

        function riser(bus, t, dur, freqStart, freqEnd, gain) {
            if (!ctx || !bus) return;
            const o = ctx.createOscillator();
            o.type = "sine";
            o.frequency.setValueAtTime(freqStart, t);
            o.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
            const g = ctx.createGain();
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(gain, t + 0.05);
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            o.connect(g);
            g.connect(bus);
            o.start(t);
            o.stop(t + dur + 0.05);
        }

        function pad(bus, notes, t, dur, gain) {
            notes.forEach(m => {
                voice(bus, "sine", m, t, dur, gain, { attack: 0.4, release: 0.3 });
            });
        }

        /* Instrument helpers */
        function kick(bus, t, isDark) {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.type = "sine";
            o.frequency.setValueAtTime(130, t);
            o.frequency.exponentialRampToValueAtTime(44, t + 0.1);
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(isDark ? 0.3 : 0.4, t + 0.01);
            g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
            o.connect(g);
            g.connect(bus);
            o.start(t);
            o.stop(t + 0.2);
        }

        function snare(bus, t, isDark) {
            noiseHit(bus, t, 0.15, isDark ? 0.15 : 0.2, "highpass", 3600, 1);
        }

        function hat(bus, t, accent, isDark) {
            noiseHit(bus, t, 0.08, accent ? 0.06 : 0.03, "highpass", 8000 + Math.random() * 2000, 0.6);
        }

        function pizz(t, midi) {
            voice(musicBus, "triangle", midi, t, 0.16, 0.16, { filter: 900, q: 2 });
            voice(musicBus, "sawtooth", midi - 12, t, 0.14, 0.07, { filter: 500 });
        }

        function bassNote(bus, midi, t, isDark) {
            voice(bus, "sine", midi, t, STEP * 4, isDark ? 0.08 : 0.06);
        }

        function leadNote(bus, midi, t, isDark) {
            voice(bus, "square", midi, t, STEP * 2, 0.075, { filter: 2400, q: 1, delay: true });
            voice(bus, "sawtooth", midi + 12, t, STEP * 2, 0.03, { filter: 2000 });
        }

        function bell(t) {
            voice(musicBus, "triangle", 91, t, 0.5, 0.07, { delay: true });
            voice(musicBus, "sine", 91, t, 0.7, 0.05);
        }

        function rim(t) {
            noiseHit(musicBus, t, 0.06, 0.12, "bandpass", 1600, 1.4);
            voice(musicBus, "square", 82, t, 0.05, 0.04, { filter: 1200 });
        }

        /* ============ MUSICAL DATA ============ */
        const MENU_CHORDS = [
            { root: 45, notes: [57, 60, 64] }, // Am
            { root: 41, notes: [53, 57, 60] }, // F
            { root: 48, notes: [60, 64, 67] }, // C
            { root: 43, notes: [55, 59, 62] }  // G
        ];

        const MENU_HOOK = [69, 0, 72, 0, 76, 0, 72, 0, 69, 0, 72, 76, 79, 0, 76, 0, 77, 0, 76, 0, 74, 0, 72, 0, 74, 76, 77, 0, 81, 0, 77, 0];

        const CHASE_ROOTS = [38, 34, 41, 36];
        const CHASE_LEAD = [62, 0, 65, 0, 69, 0, 65, 0, 62, 0, 65, 69, 72, 0, 69, 0, 70, 0, 69, 0, 67, 0, 65, 0, 67, 69, 70, 0, 72, 0, 70, 0];
        const TRUCK_LEAD = [74, 0, 76, 0, 79, 0, 76, 0, 74, 0, 76, 79, 81, 0, 79, 0, 81, 0, 79, 0, 76, 0, 74, 0, 76, 79, 81, 0, 84, 0, 81, 0];

        /* ============ MOTIFS (one-shot) ============ */

        function titleSnippet(t) {
            [69, 76, 81, 88, 93].forEach((m, i) => {
                voice(motifBus, "square", m, t + i * 0.09, 0.16, 0.07, { filter: 3000, q: 0.8, delay: true });
            });
            pad(motifBus, [69, 72, 76, 81], t + 0.42, 0.7, 0.06);
        }

        function menuStart(t) {
            [69, 72, 76, 81].forEach((m, i) => {
                voice(motifBus, "triangle", m, t + i * 0.06, 0.14, 0.06, { filter: 3200, delay: true });
            });
        }

        function chaseStart(t) {
            riser(chaseBus, t, 0.45, 70, 280, 0.1);
            kick(chaseBus, t + 0.48, true);
        }

        function countdownMotif(t) {
            [76, 76, 76].forEach((m, i) => {
                voice(motifBus, "square", m, t + i * 0.7, 0.12, 0.08);
            });
            riser(motifBus, t + 1.6, 0.5, 200, 800, 0.08);
            pad(motifBus, [69, 76, 81, 88], t + 2.1, 0.9, 0.09);
        }

        function nitroMotif(t) {
            riser(motifBus, t, 0.3, 400, 1200, 0.15);
        }

        function crashMotif(t) {
            noiseHit(motifBus, t, 0.4, 0.18, "lowpass", 1200, 0.5);
        }

        function nearMissMotif(t) {
            voice(motifBus, "sine", 60, t, 0.4, 0.2);
            voice(motifBus, "sine", 40, t + 0.02, 0.45, 0.18);
        }

        function truckMotif(t) {
            voice(motifBus, "sawtooth", 38, t, 1.0, 0.1, { filter: 700, q: 3 });
            voice(motifBus, "sawtooth", 44, t, 1.0, 0.1, { filter: 700, q: 3 });
            riser(sfxBus, t, 0.8, 80, 30, 0.12);
            noiseHit(sfxBus, t, 0.5, 0.18, "lowpass", 400, 1);
        }

        function wreckedMotif(t) {
            [62, 60, 57, 50].forEach((m, i) => {
                voice(motifBus, "sawtooth", m, t + i * 0.24, 0.5, 0.08, { filter: 1200, q: 0.8 });
            });
            pad(motifBus, [38, 50, 53], t + 1.0, 1.4, 0.06);
        }

        function achievementMotif(t) {
            [76, 79, 81].forEach((m, i) => {
                voice(motifBus, "triangle", m, t + i * 0.1, 0.16, 0.08, { filter: 3000, delay: true });
            });
        }

        function upgradeMotif(t) {
            riser(motifBus, t, 0.45, 300, 1200, 0.07);
        }

        function shopMotif(t) {
            voice(motifBus, "sine", 60, t, 0.3, 0.15);
            voice(motifBus, "sine", 67, t + 0.05, 0.3, 0.12);
        }

        /* ============ LOOPERS ============ */

        let menuLoopRunning = false;
        let chaseLoopRunning = false;
        let introLoopRunning = false;

        function scheduleMenu(step, t) {
            const bar = Math.floor(step / 16) % 4;
            const chord = MENU_CHORDS[bar];
            const sb = step % 16;

            if (sb === 0) pad(menuBus, chord.notes, t, STEP * 16, 0.05);
            if (step % 4 === 0) kick(menuBus, t, false);
            if (step % 8 === 4) snare(menuBus, t, false);
            if (step % 2 === 0) hat(menuBus, t, step % 4 === 2, false);

            let bassMidi = 0;
            if (sb % 4 === 0) bassMidi = chord.root - 12;
            else if (sb % 4 === 2) bassMidi = chord.root;
            if (bassMidi) bassNote(menuBus, bassMidi, t, false);

            const arp = chord.notes[step % chord.notes.length] + 12;
            voice(menuBus, "triangle", arp, t, 0.14, 0.04, { filter: 3200, q: 0.7, delay: true });

            const hook = MENU_HOOK[step % MENU_HOOK.length];
            if (hook) leadNote(menuBus, hook, t, false);
        }

        function scheduleChase(step, t) {
            const bar = Math.floor(step / 16) % 4;
            const chord = CHASE_ROOTS[bar];
            const sb = step % 16;

            if (sb === 0) pad(chaseBus, [chord, chord + 4, chord + 7], t, STEP * 16, 0.04);
            if (step % 4 === 0) kick(chaseBus, t, false);
            if (step % 8 === 4) snare(chaseBus, t, false);
            if (step % 2 === 0) hat(chaseBus, t, step % 4 === 2, false);

            let bassMidi = 0;
            if (sb % 4 === 0) bassMidi = chord;
            else if (sb % 4 === 2) bassMidi = chord + 5;
            if (bassMidi) bassNote(chaseBus, bassMidi, t, false);

            const note = CHASE_LEAD[step % CHASE_LEAD.length];
            if (note) leadNote(chaseBus, note, t, false);
        }

        function startMenuLoop() {
            ensureAudio();
            if (!ctx || menuLoopRunning) return;
            menuLoopRunning = true;
            loopStep = 0;
            const start = ctx.currentTime + 0.1;
            master.gain.setTargetAtTime(0.22, ctx.currentTime, 0.2);

            const loop = () => {
                if (!menuLoopRunning) return;
                if (ctx.state !== "running") return;
                const t = start + loopStep * STEP;
                if (t < ctx.currentTime - 0.1) {
                    loopStep = Math.floor((ctx.currentTime - start) / STEP);
                }
                while (start + loopStep * STEP < ctx.currentTime + 0.5) {
                    scheduleMenu(loopStep % 64, start + loopStep * STEP);
                    loopStep++;
                }
                setTimeout(loop, 25);
            };
            loop();
        }

        function startChaseLoop() {
            ensureAudio();
            if (!ctx || chaseLoopRunning) return;
            chaseLoopRunning = true;
            loopStep = 0;
            const start = ctx.currentTime + 0.1;
            master.gain.setTargetAtTime(0.22, ctx.currentTime, 0.2);

            const loop = () => {
                if (!chaseLoopRunning) return;
                if (ctx.state !== "running") return;
                const t = start + loopStep * STEP;
                if (t < ctx.currentTime - 0.1) {
                    loopStep = Math.floor((ctx.currentTime - start) / STEP);
                }
                while (start + loopStep * STEP < ctx.currentTime + 0.5) {
                    scheduleChase(loopStep % 64, start + loopStep * STEP);
                    loopStep++;
                }
                setTimeout(loop, 25);
            };
            loop();
        }

        function startIntroLoop() {
            ensureAudio();
            if (!ctx || introLoopRunning) return;
            introLoopRunning = true;
            loopStep = 0;
            const start = ctx.currentTime + 0.1;
            master.gain.setTargetAtTime(0.22, ctx.currentTime, 0.2);

            const loop = () => {
                if (!introLoopRunning) return;
                if (ctx.state !== "running") return;
                const t = start + loopStep * STEP;
                if (t < ctx.currentTime - 0.1) {
                    loopStep = Math.floor((ctx.currentTime - start) / STEP);
                }
                while (start + loopStep * STEP < ctx.currentTime + 0.5) {
                    scheduleChase(loopStep % 64, start + loopStep * STEP); // Same as chase for now
                    loopStep++;
                }
                setTimeout(loop, 25);
            };
            loop();
        }

        function stopAllLoops() {
            menuLoopRunning = false;
            chaseLoopRunning = false;
            introLoopRunning = false;
            if (ctx && master) {
                master.gain.setTargetAtTime(0, ctx.currentTime, 0.1);
            }
        }

        /* ============ UI ============ */

        const soundButtons = document.querySelectorAll('.sound-btn');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeValue = document.getElementById('volumeValue');
        const stopBtn = document.getElementById('stopBtn');
        const nowPlaying = document.getElementById('nowPlaying');

        soundButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const type = btn.dataset.type;
                const sound = btn.dataset.sound;

                stopAllLoops();

                ensureAudio();
                if (!ctx) {
                    nowPlaying.textContent = '⚠ AUDIO NOT AVAILABLE';
                    return;
                }

                const t = ctx.currentTime + 0.01;
                const label = btn.querySelector('.sound-label').textContent;

                if (type === 'loop') {
                    if (sound === 'menu') startMenuLoop();
                    else if (sound === 'chase') startChaseLoop();
                    else if (sound === 'intro') startIntroLoop();
                    nowPlaying.textContent = `🔄 ${label}`;
                } else {
                    if (sound === 'title') titleSnippet(t);
                    else if (sound === 'menuStart') menuStart(t);
                    else if (sound === 'chaseStart') chaseStart(t);
                    else if (sound === 'countdown') countdownMotif(t);
                    else if (sound === 'nitro') nitroMotif(t);
                    else if (sound === 'crash') crashMotif(t);
                    else if (sound === 'nearMiss') nearMissMotif(t);
                    else if (sound === 'truck') truckMotif(t);
                    else if (sound === 'wrecked') wreckedMotif(t);
                    else if (sound === 'achievement') achievementMotif(t);
                    else if (sound === 'upgrade') upgradeMotif(t);
                    else if (sound === 'shop') shopMotif(t);
                    nowPlaying.textContent = `▶ ${label}`;
                }
            });
        });

        volumeSlider.addEventListener('input', (e) => {
            if (master) {
                master.gain.value = (e.target.value / 100) * 0.22;
            }
            volumeValue.textContent = e.target.value + '%';
        });

        stopBtn.addEventListener('click', () => {
            stopAllLoops();
            nowPlaying.textContent = '⏹ STOPPED';
        });

        document.addEventListener('click', () => {
            ensureAudio();
        }, { once: true });
    </script>
</body>
</html>
