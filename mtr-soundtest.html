<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR. TRUCK'S REVENGE - Sound Test</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        #sound-test-container {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            padding: 20px;
        }

        .sound-box {
            background: linear-gradient(145deg, rgba(12, 18, 32, .96), rgba(8, 12, 24, .98));
            border: 3px solid transparent;
            border-image: linear-gradient(135deg, rgba(0, 0, 0, 0.8), rgba(30, 30, 60, 0.4), rgba(0, 0, 0, 0.8)) 1;
            border-radius: 20px;
            padding: 40px;
            max-width: 700px;
            width: 90%;
            box-shadow: 0 0 60px rgba(42, 82, 152, .25), inset 0 0 40px rgba(0, 10, 25, .7);
            position: relative;
        }

        .sound-title {
            font-size: 48px;
            font-weight: 900;
            color: var(--accent);
            text-shadow: 0 0 10px rgba(0, 255, 213, .3), 0 0 30px rgba(0, 255, 213, .2);
            margin-bottom: 32px;
            text-align: center;
            letter-spacing: -1px;
        }

        .sound-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .sound-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 16px;
            background: linear-gradient(135deg, rgba(0, 255, 213, .1), rgba(0, 255, 213, .05));
            border: 2px solid var(--accent);
            border-radius: 12px;
            color: var(--text);
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: all .2s cubic-bezier(.4, 0, .2, 1);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: .5px;
        }

        .sound-btn:hover {
            background: linear-gradient(135deg, rgba(0, 255, 213, .2), rgba(0, 255, 213, .1));
            box-shadow: 0 0 20px rgba(0, 255, 213, .4);
            transform: translateY(-2px);
        }

        .sound-btn:active {
            transform: translateY(0);
            box-shadow: 0 0 10px rgba(0, 255, 213, .2);
        }

        .sound-icon {
            font-size: 24px;
        }

        .sound-label {
            font-size: 11px;
        }

        .sound-controls {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .volume-slider {
            width: 200px;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(0, 255, 213, .2);
            outline: none;
            border-radius: 3px;
            accent-color: var(--accent);
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: var(--accent);
            cursor: pointer;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0, 255, 213, .6);
        }

        .volume-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--accent);
            cursor: pointer;
            border-radius: 50%;
            border: none;
            box-shadow: 0 0 10px rgba(0, 255, 213, .6);
        }

        .volume-label {
            font-size: 14px;
            color: var(--accent);
            text-shadow: 0 0 6px var(--crt-glow);
        }

        .volume-value {
            font-weight: 700;
            color: var(--gold);
            min-width: 30px;
        }

        .sound-info {
            text-align: center;
            color: #889;
            font-size: 12px;
            margin-bottom: 24px;
            padding: 12px;
            border: 1px solid rgba(0, 255, 213, .15);
            border-radius: 8px;
            background: rgba(0, 20, 30, .3);
        }

        .controls-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .control-btn {
            background: linear-gradient(135deg, var(--accent), #0ca);
            color: #000;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all .2s cubic-bezier(.4, 0, .2, 1);
            text-transform: uppercase;
            letter-spacing: .5px;
        }

        .control-btn:hover {
            box-shadow: 0 4px 20px rgba(0, 255, 213, .4);
            transform: translateY(-1px);
        }

        .control-btn:active {
            transform: translateY(0);
        }

        .back-btn {
            background: rgba(255, 61, 87, .2);
            color: var(--danger);
            border: 2px solid var(--danger);
            padding: 10px 20px;
            font-size: 12px;
        }

        .back-btn:hover {
            background: var(--danger);
            color: #fff;
            box-shadow: 0 4px 20px rgba(255, 61, 87, .4);
        }

        .now-playing {
            text-align: center;
            color: var(--gold);
            font-size: 13px;
            font-weight: 700;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 215, 0, .2);
            min-height: 20px;
            text-shadow: 0 0 6px rgba(255, 215, 0, .3);
        }

        @media (max-width: 600px) {
            .sound-box {
                padding: 24px;
            }

            .sound-title {
                font-size: 32px;
                margin-bottom: 24px;
            }

            .sound-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .volume-slider {
                width: 120px;
            }
        }
    </style>
</head>
<body>
    <div id="sound-test-container">
        <div class="sound-box">
            <div class="sound-title">🎵 SOUND TEST 🎵</div>
            
            <div class="sound-info">
                Experience the audio synthesis engine. Click any sound to hear it generated in real-time.
            </div>

            <div class="sound-controls">
                <div class="volume-control">
                    <span class="volume-label">MASTER:</span>
                    <input type="range" min="0" max="100" value="70" class="volume-slider" id="volumeSlider">
                    <span class="volume-value" id="volumeValue">70%</span>
                </div>
            </div>

            <div class="controls-bar">
                <button class="control-btn" id="stopBtn">⏹ STOP ALL</button>
            </div>

            <div class="sound-grid">
                <button class="sound-btn" data-sound="heartbeat">
                    <span class="sound-icon">💓</span>
                    <span class="sound-label">HEARTBEAT</span>
                </button>
                <button class="sound-btn" data-sound="kick">
                    <span class="sound-icon">🥁</span>
                    <span class="sound-label">KICK</span>
                </button>
                <button class="sound-btn" data-sound="bell">
                    <span class="sound-icon">🔔</span>
                    <span class="sound-label">BELL</span>
                </button>
                <button class="sound-btn" data-sound="pizz">
                    <span class="sound-icon">🎸</span>
                    <span class="sound-label">PIZZ</span>
                </button>
                <button class="sound-btn" data-sound="riser">
                    <span class="sound-icon">📈</span>
                    <span class="sound-label">RISER</span>
                </button>
                <button class="sound-btn" data-sound="noise">
                    <span class="sound-icon">⚡</span>
                    <span class="sound-label">NOISE</span>
                </button>
                <button class="sound-btn" data-sound="chirp">
                    <span class="sound-icon">🐦</span>
                    <span class="sound-label">CHIRP</span>
                </button>
                <button class="sound-btn" data-sound="typewriter">
                    <span class="sound-icon">⌨️</span>
                    <span class="sound-label">TYPE</span>
                </button>
            </div>

            <div class="controls-bar">
                <button class="control-btn back-btn" onclick="window.history.back()">← BACK</button>
            </div>

            <div class="now-playing" id="nowPlaying">— READY —</div>
        </div>
    </div>

    <script>
        /* ============ WEBAUDIO SYNTHESIS ENGINE ============ */
        
        let ctx = null;
        let master = null;
        let sfxBus = null;
        let noiseBuffer = null;

        // Initialize audio context
        function getAudioContext() {
            try {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return null;

                if (!ctx) {
                    ctx = new AC();
                    
                    // Master output
                    master = ctx.createGain();
                    master.gain.value = 0.7;
                    master.connect(ctx.destination);

                    // SFX bus
                    sfxBus = ctx.createGain();
                    sfxBus.gain.value = 0.8;
                    sfxBus.connect(master);

                    // Create noise buffer for percussive sounds
                    noiseBuffer = makeNoiseBuffer();
                }

                if (ctx.state === "suspended") {
                    ctx.resume().catch(() => {});
                }

                return ctx;
            } catch (e) {
                console.error("AudioContext error:", e);
                return null;
            }
        }

        // Generate white noise buffer
        function makeNoiseBuffer() {
            if (!ctx) return null;
            const len = Math.floor(ctx.sampleRate * 1.0);
            const buffer = ctx.createBuffer(1, len, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < len; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 2);
            }
            return buffer;
        }

        // MIDI note to Hz conversion
        function midiHz(m) {
            return 440 * Math.pow(2, (m - 69) / 12);
        }

        // Oscillator voice with envelope
        function voice(bus, type, midi, t, dur, gain, opts = {}) {
            if (!ctx || !bus) return;

            const o = ctx.createOscillator();
            o.type = type;
            o.frequency.value = midiHz(midi);

            const g = ctx.createGain();
            const attack = opts.attack == null ? 0.006 : opts.attack;

            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(Math.max(0.001, gain), t + attack);
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

            o.connect(g);
            g.connect(bus);

            o.start(t);
            o.stop(t + dur + 0.08);
        }

        // Noise hit for percussive/noisy sounds
        function noiseHit(bus, t, dur, gain, filterType = "bandpass", freq = 1000, q = 1) {
            if (!ctx || !bus || !noiseBuffer) return;

            const src = ctx.createBufferSource();
            src.buffer = noiseBuffer;

            const f = ctx.createBiquadFilter();
            f.type = filterType;
            f.frequency.value = freq;
            f.Q.value = q;

            const g = ctx.createGain();
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(Math.max(0.001, gain), t + 0.004);
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

            src.connect(f);
            f.connect(g);
            g.connect(bus);

            src.start(t);
            src.stop(t + dur + 0.05);
        }

        // Frequency riser
        function riser(bus, t, dur, freqStart, freqEnd, gain) {
            if (!ctx || !bus) return;

            const o = ctx.createOscillator();
            o.type = "sine";
            o.frequency.setValueAtTime(freqStart, t);
            o.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);

            const g = ctx.createGain();
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(gain, t + 0.05);
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

            o.connect(g);
            g.connect(bus);

            o.start(t);
            o.stop(t + dur + 0.05);
        }

        /* ============ SOUND EFFECTS ============ */

        function playHeartbeat() {
            const t = ctx.currentTime + 0.01;
            voice(sfxBus, "sine", 34, t, 0.24, 0.22);
            voice(sfxBus, "sine", 34, t + 0.28, 0.18, 0.2);
        }

        function playKick() {
            const t = ctx.currentTime + 0.01;
            const o = ctx.createOscillator();
            const g = ctx.createGain();

            o.type = "sine";
            o.frequency.setValueAtTime(130, t);
            o.frequency.exponentialRampToValueAtTime(44, t + 0.1);

            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(0.4, t + 0.01);
            g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);

            o.connect(g);
            g.connect(sfxBus);

            o.start(t);
            o.stop(t + 0.2);
        }

        function playBell() {
            const t = ctx.currentTime + 0.01;
            voice(sfxBus, "triangle", 91, t, 0.5, 0.07);
            voice(sfxBus, "sine", 91, t, 0.7, 0.05);
        }

        function playPizz() {
            const t = ctx.currentTime + 0.01;
            voice(sfxBus, "triangle", 39, t, 0.16, 0.16);
            voice(sfxBus, "sawtooth", 27, t, 0.14, 0.07);
        }

        function playRiser() {
            const t = ctx.currentTime + 0.01;
            riser(sfxBus, t, 0.8, 80, 600, 0.12);
        }

        function playNoise() {
            const t = ctx.currentTime + 0.01;
            noiseHit(sfxBus, t, 0.35, 0.2, "highpass", 3000, 0.8);
        }

        function playChirp() {
            const t = ctx.currentTime + 0.01;
            voice(sfxBus, "triangle", 84, t, 0.12, 0.15);
            voice(sfxBus, "sine", 72, t + 0.1, 0.12, 0.1);
        }

        function playTypewriter() {
            const t = ctx.currentTime + 0.01;
            noiseHit(sfxBus, t, 0.025, 0.05, "highpass", 4200 + Math.random() * 1800, 0.8);
        }

        function stopAll() {
            if (ctx) {
                ctx.close();
                ctx = null;
                master = null;
                sfxBus = null;
            }
        }

        /* ============ UI EVENT HANDLERS ============ */

        const soundButtons = document.querySelectorAll('.sound-btn');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeValue = document.getElementById('volumeValue');
        const stopBtn = document.getElementById('stopBtn');
        const nowPlaying = document.getElementById('nowPlaying');

        const soundMap = {
            heartbeat: playHeartbeat,
            kick: playKick,
            bell: playBell,
            pizz: playPizz,
            riser: playRiser,
            noise: playNoise,
            chirp: playChirp,
            typewriter: playTypewriter
        };

        soundButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const soundName = btn.dataset.sound;
                const soundFn = soundMap[soundName];

                if (soundFn) {
                    getAudioContext();
                    if (!ctx) {
                        nowPlaying.textContent = '⚠ AUDIO NOT AVAILABLE';
                        return;
                    }

                    soundFn();
                    const label = btn.querySelector('.sound-label').textContent;
                    nowPlaying.textContent = `▶ ${label}`;
                }
            });
        });

        volumeSlider.addEventListener('input', (e) => {
            if (master) {
                master.gain.value = e.target.value / 100 * 0.7;
            }
            volumeValue.textContent = e.target.value + '%';
        });

        stopBtn.addEventListener('click', () => {
            stopAll();
            nowPlaying.textContent = '⏹ STOPPED';
        });

        // Initialize on first interaction
        document.addEventListener('click', () => {
            getAudioContext();
        }, { once: true });
    </script>
</body>
</html>
